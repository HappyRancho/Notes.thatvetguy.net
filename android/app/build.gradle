plugins { id 'com.android.application' }

android {
    namespace 'net.thatvetguy.notes'
    compileSdk 36
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'net.thatvetguy.notes'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('RX_NOTES_KEYSTORE')) {
                storeFile file(System.getenv('RX_NOTES_KEYSTORE'))
                storePassword System.getenv('RX_NOTES_KEYSTORE_PASSWORD')
                keyAlias 'rx-notes'
                keyPassword System.getenv('RX_NOTES_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('RX_NOTES_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
