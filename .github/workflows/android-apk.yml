name: Android APK
on:
  push:
    branches: [feat/android-live-app]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and build optimized APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Upload build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-notes-android-build
          retention-days: 14
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash android/run-device-tests.sh
      - name: Upload device-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rx-notes-android-device-tests
          retention-days: 14
          path: |
            android-qa/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
