name: AdSense public readiness inspection
on:
  push:
    branches: [homepage-approved-mockups]
permissions:
  contents: read
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[adsense]') && !contains(github.event.head_commit.message, '[generated]')
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-adsense-live.py --audit-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adsense-public-readiness
          path: docs/qa/adsense/live.json
