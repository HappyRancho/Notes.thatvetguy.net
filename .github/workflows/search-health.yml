name: Search visibility HTTP audit
on:
  push:
    branches: [homepage-approved-mockups, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crawl:
    if: "contains(github.event.head_commit.message, '[seo-audit]') || github.event_name == 'workflow_dispatch'"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/search-health.py --label '${{ github.ref_name == 'main' && 'production' || 'baseline' }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-health-${{ github.sha }}
          path: docs/qa/search/
