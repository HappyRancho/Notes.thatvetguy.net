name: Tools app icons
on:
  push:
    branches: [homepage-approved-mockups]
permissions:
  contents: write
jobs:
  icons:
    if: contains(github.event.head_commit.message, '[tools-assets]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==13.0.0
      - run: python3 scripts/ci/import-app-icons.py
      - name: Retain attributed icons
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tools/apps/ data/app-icon-sources.json
          git commit -m 'Tools — retain original Google Play app icons [generated]'
          git push origin HEAD:homepage-approved-mockups
