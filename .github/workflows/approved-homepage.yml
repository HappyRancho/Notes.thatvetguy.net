name: Approved homepage QA
on:
  push:
    branches: [homepage-approved-mockups]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: "!contains(github.event.head_commit.message, '[generated]') && !contains(github.event.head_commit.message, '[source-import]')"
    concurrency:
      group: approved-homepage-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install fonttools brotli pillow
        if: "!contains(github.event.head_commit.message, '[search-keywords]')"
      - run: python3 scripts/prepare-fonts.py
        if: "!contains(github.event.head_commit.message, '[search-keywords]')"
      - run: npm install && npx playwright install --with-deps chromium
        if: "!contains(github.event.head_commit.message, '[search-keywords]')"
      - run: npm run build && npm run check
      - name: Render approved homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add books/ assets/books/ assets/social/books/ data/books.json
          git add _headers _redirects index.html index.md 404.html 404/ bvsc/ objective/ clinical/ study-tools/ search/ about/ request-resource/ assets/fonts/ data/page-history.json data/drive_manifest.json data/resources.json data/catalogue.json data/duplicates-report.json assets/catalogue.json search-index.json build-info.json robots.txt sitemap.xml llms.txt llms-full.txt docs/qa/task3/counts.json docs/qa/task3/contrast.json
          if ! git diff --cached --quiet; then
            git commit -m 'Homepage — render approved mockup UI and retrieval pages [generated]'
            git push origin HEAD:homepage-approved-mockups
          fi
      - run: node scripts/homepage-qa.mjs
        if: "!contains(github.event.head_commit.message, '[subject-row-fix]') && !contains(github.event.head_commit.message, '[collection-cards]') && !contains(github.event.head_commit.message, '[year-hubs]') && !contains(github.event.head_commit.message, '[roadmap-spacing]') && !contains(github.event.head_commit.message, '[subject-refinement]') && !contains(github.event.head_commit.message, '[search-keywords]') && !contains(github.event.head_commit.message, '[subject-layout]') && !contains(github.event.head_commit.message, '[book-pages]') && !contains(github.event.head_commit.message, '[subject-blueprint]')"
      - run: node scripts/collection-cards-qa.mjs
        if: contains(github.event.head_commit.message, '[collection-cards]')
      - run: node scripts/year-hubs-qa.mjs
        if: contains(github.event.head_commit.message, '[year-hubs]')
      - run: node scripts/roadmaps-qa.mjs
        if: contains(github.event.head_commit.message, '[roadmaps]')
      - run: node scripts/academic-pages-qa.mjs
        if: contains(github.event.head_commit.message, '[subject-pages]')
        env:
          QA_ACADEMIC_SMOKE: ${{ contains(github.event.head_commit.message, '[subject-refinement]') && '1' || '' }}
      - run: node scripts/subject-reader-qa.mjs
        if: contains(github.event.head_commit.message, '[subject-layout]')
      - run: node scripts/book-pages-qa.mjs
        if: contains(github.event.head_commit.message, '[book-pages]')
      - run: node scripts/subject-hub-qa.mjs
        if: contains(github.event.head_commit.message, '[subject-blueprint]') && !contains(github.event.head_commit.message, '[subject-regression]')
      - name: Lighthouse and page regression
        if: "!contains(github.event.head_commit.message, '[search-keywords]')"
        run: npm run qa -- mockup-after
        env:
          QA_PATHS: ${{ contains(github.event.head_commit.message, '[subject-blueprint]') && '/bvsc/year-1/veterinary-anatomy/,/bvsc/year-1/veterinary-anatomy/syllabus/,/bvsc/year-1/veterinary-anatomy/practicals/,/bvsc/year-4/veterinary-medicine/' || contains(github.event.head_commit.message, '[book-orientation]') && '/books/dukes-physiology-of-domestic-animals/,/books/animal-breeding/' || contains(github.event.head_commit.message, '[book-pages]') && '/books/,/books/animal-nutrition/,/books/dhruv-desai/,/books/plumbs-handbook/,/books/primary-veterinary-anatomy/' || contains(github.event.head_commit.message, '[subject-layout]') && '/bvsc/year-1/veterinary-anatomy/,/bvsc/year-3/veterinary-pharmacology-and-toxicology/,/bvsc/year-4/veterinary-clinical-practices-ii/' || contains(github.event.head_commit.message, '[font-stability]') && '/' || contains(github.event.head_commit.message, '[subject-pages]') && '/bvsc/year-1/,/bvsc/year-4/,/bvsc/year-1/veterinary-anatomy/,/bvsc/year-3/veterinary-pharmacology-and-toxicology/' || contains(github.event.head_commit.message, '[roadmaps]') && '/bvsc/year-1/roadmap/,/bvsc/year-2/roadmap/,/bvsc/year-3/roadmap/,/bvsc/year-4/roadmap/' || contains(github.event.head_commit.message, '[home-spacing]') && '/,/bvsc/year-1/,/objective/' || contains(github.event.head_commit.message, '[year-hubs]') && '/,/bvsc/year-1/,/bvsc/year-2/,/bvsc/year-3/,/bvsc/year-4/' || contains(github.event.head_commit.message, '[collection-cards]') && '/objective/,/clinical/drug-index/,/clinical/handbooks/' || contains(github.event.head_commit.message, '[subject-row-fix]') && '/bvsc/year-1/veterinary-anatomy/' || '/,/objective/,/clinical/handbooks/,/clinical/drug-index/,/bvsc/year-1/veterinary-anatomy/' }}
          QA_WIDTHS: ${{ contains(github.event.head_commit.message, '[font-stability]') && '360,375,390,412,430,768,1024,1280,1440' || '360,390,430,1280' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: approved-homepage
          path: |
            docs/qa/subject-hubs/
            docs/qa/book-pages/
            docs/qa/subject-reader/
            docs/qa/academic-pages/
            docs/qa/year-hubs/
            docs/qa/roadmaps/
            docs/qa/collection-cards/
            docs/qa/mockup-homepage/
            docs/qa/task3/mockup-after/
