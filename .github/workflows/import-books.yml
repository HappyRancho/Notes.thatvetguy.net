name: Inspect subject Books folders
on:
  push:
    branches: [homepage-approved-mockups]
permissions:
  contents: write
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[books-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/import-book-folders.py
      - name: Save Books-only source metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vetverse-books.json
          git commit -m 'Record verified subject Books folders [generated]'
          git push origin HEAD:homepage-approved-mockups
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: subject-books-source
          path: data/vetverse-books.json
