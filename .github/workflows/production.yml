name: Production verification
on: [push, workflow_dispatch]
jobs:
  production:
    if: startsWith(github.event.head_commit.message, 'A:') || contains(github.event.head_commit.message, '[production-qa]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/verify-deploy.py
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - run: npm run qa -- task2-production-before
        continue-on-error: true
        env:
          QA_BASE_URL: https://notes.thatvetguy.net
          QA_WIDTHS: 360,390,412
          QA_SKIP_INTERACTIONS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-verification
          path: docs/qa/task2-production*/
