name: Production verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production:
    if: contains(github.event.head_commit.message, '[generated]') || contains(github.event.head_commit.message, '[production-qa]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the exact production build
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/verify-deploy.py; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 20
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Check both hostnames
        if: always()
        run: python3 scripts/task3-hosting.py
      - name: Check public robots.txt matches the intended crawler policy
        run: python3 scripts/ci/check-live-robots.py
      - name: Audit search endpoints after exact-build verification
        run: python3 scripts/search-health.py --label production
      - name: Notify search engines of published changes
        continue-on-error: true
        run: python3 scripts/notify-indexnow.py
      - name: Install browser audit dependencies
        run: npm install && npx playwright install --with-deps chromium
        timeout-minutes: 8
      - name: Verify live AdSense script and both ads.txt files
        if: contains(github.event.head_commit.message, '[adsense]')
        run: python3 scripts/check-adsense-live.py && node scripts/adsense-qa.mjs
        env:
          QA_BASE_URL: https://notes.thatvetguy.net
      - name: Production Lighthouse and axe
        run: npm run qa -- production
        env:
          QA_BASE_URL: https://notes.thatvetguy.net
          QA_PATHS: ${{ contains(github.event.head_commit.message, '[adsense]') && '/,/bvsc/year-1/roadmap/,/bvsc/tanuvas-notes/,/objective/,/books/dhruv-desai/' || contains(github.event.head_commit.message, '[tanuvas-refresh]') && '/,/bvsc/tanuvas-notes/,/bvsc/year-1/veterinary-anatomy/,/bvsc/year-4/veterinary-medicine/,/bvsc/year-3/livestock-products-technology/,/objective/' || contains(github.event.head_commit.message, '[search-discovery]') && '/,/bvsc/tanuvas-notes/,/bvsc/syllabus/,/bvsc/year-1/veterinary-anatomy/' || contains(github.event.head_commit.message, '[study-tools]') && '/,/search/,/study-tools/,/study-tools/vet-apps/,/study-tools/online-resources/,/study-tools/veterinary-careers/' || contains(github.event.head_commit.message, '[resource-polish]') && '/bvsc/year-1/veterinary-anatomy/,/bvsc/year-1/veterinary-anatomy/syllabus/,/bvsc/year-1/veterinary-anatomy/practicals/,/books/primary-veterinary-anatomy/,/search/' || contains(github.event.head_commit.message, '[subject-blueprint]') && '/bvsc/year-1/veterinary-anatomy/,/bvsc/year-1/veterinary-anatomy/syllabus/,/bvsc/year-1/veterinary-anatomy/practicals/,/bvsc/year-4/veterinary-medicine/' || contains(github.event.head_commit.message, '[book-orientation]') && '/books/dukes-physiology-of-domestic-animals/,/books/animal-breeding/' || contains(github.event.head_commit.message, '[book-pages]') && '/books/,/books/animal-nutrition/,/books/dhruv-desai/,/books/plumbs-handbook/,/books/primary-veterinary-anatomy/' || contains(github.event.head_commit.message, '[subject-layout]') && '/bvsc/year-1/veterinary-anatomy/,/bvsc/year-3/veterinary-pharmacology-and-toxicology/,/bvsc/year-4/veterinary-clinical-practices-ii/' || contains(github.event.head_commit.message, '[font-stability]') && '/,/bvsc/year-1/,/bvsc/year-1/veterinary-anatomy/' || contains(github.event.head_commit.message, '[subject-pages]') && '/bvsc/year-1/,/bvsc/year-4/,/bvsc/year-1/veterinary-anatomy/,/bvsc/year-3/veterinary-pharmacology-and-toxicology/' || '/,/bvsc/,/bvsc/year-1/,/bvsc/year-1/veterinary-anatomy/,/objective/,/clinical/handbooks/,/clinical/drug-index/,/study-tools/,/search/,/about/,/request-resource/' }}
          QA_WIDTHS: ${{ contains(github.event.head_commit.message, '[adsense]') && '360,390,430' || contains(github.event.head_commit.message, '[font-stability]') && '360,390,412,768' || '360,390,412' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-production
          path: |
            docs/qa/adsense/
            docs/qa/task3/production/
            docs/qa/task3/hosting.json
            docs/qa/task2-production/deployment.json
            docs/qa/search/production.json
            docs/qa/search/robots-policy.json
            docs/qa/search/indexnow.json
