name: Production verification
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production:
    if: contains(github.event.head_commit.message, '[generated]') || contains(github.event.head_commit.message, '[production-qa]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for the exact production build
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python3 scripts/verify-deploy.py; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 20
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Check both hostnames
        if: always()
        run: python3 scripts/task3-hosting.py
      - name: Audit search endpoints after exact-build verification
        run: python3 scripts/search-health.py --label production
      - name: Install browser audit dependencies
        run: npm install && npx playwright install --with-deps chromium
        timeout-minutes: 8
      - name: Production Lighthouse and axe
        run: npm run qa -- production
        env:
          QA_BASE_URL: https://notes.thatvetguy.net
          QA_PATHS: ${{ contains(github.event.head_commit.message, '[subject-layout]') && '/bvsc/year-1/veterinary-anatomy/,/bvsc/year-3/veterinary-pharmacology-and-toxicology/,/bvsc/year-4/veterinary-clinical-practices-ii/' || contains(github.event.head_commit.message, '[font-stability]') && '/,/bvsc/year-1/,/bvsc/year-1/veterinary-anatomy/' || contains(github.event.head_commit.message, '[subject-pages]') && '/bvsc/year-1/,/bvsc/year-4/,/bvsc/year-1/veterinary-anatomy/,/bvsc/year-3/veterinary-pharmacology-and-toxicology/' || '/,/bvsc/,/bvsc/year-1/,/bvsc/year-1/veterinary-anatomy/,/objective/,/clinical/handbooks/,/clinical/drug-index/,/study-tools/,/search/,/about/,/request-resource/' }}
          QA_WIDTHS: ${{ contains(github.event.head_commit.message, '[font-stability]') && '360,390,412,768' || '360,390,412' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task3-production
          path: |
            docs/qa/task3/production/
            docs/qa/task3/hosting.json
            docs/qa/task2-production/deployment.json
            docs/qa/search/production.json
