name: Publish verified Drive library and audit
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: drive-library
  cancel-in-progress: false
jobs:
  library:
    if: contains(github.event.head_commit.message, '[drive-publish]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect the supplied public Drive folders
        run: python3 scripts/crawl-public-drive.py
      - name: Complete public listing continuation pages
        run: node scripts/finish-drive-manifest.mjs
      - name: Build and validate the source-backed library
        run: npm run build && npm run check
      - name: Commit generated library and retrieval files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html index.md 404.html 404/ bvsc/ objective/ clinical/ study-tools/ search/ about/ request-resource/ data/drive_manifest.json data/resources.json data/catalogue.json assets/catalogue.json search-index.json build-info.json robots.txt sitemap.xml llms.txt llms-full.txt docs/qa/task2-drive/
          if ! git diff --cached --quiet; then
            git commit -m 'F: publish verified Drive files, subject pages and retrieval indexes'
            git push origin HEAD:main
          fi
          git rev-parse HEAD
      - name: Full responsive and interaction QA
        run: npm run qa -- task2-after
        env:
          QA_WIDTHS: 360,390,412,768,1024,1440
      - name: Check current production build
        if: always()
        run: python3 scripts/verify-deploy.py
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Production Lighthouse and accessibility
        if: always()
        run: npm run qa -- task2-production-after
        continue-on-error: true
        env:
          QA_BASE_URL: https://notes.thatvetguy.net
          QA_WIDTHS: '390'
          QA_SKIP_INTERACTIONS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task2-library-and-qa
          path: |
            docs/qa/task2*/
            data/drive_manifest.json
            data/resources.json
