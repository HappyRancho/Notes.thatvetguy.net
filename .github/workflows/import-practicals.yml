name: Inspect subject Practical folders
on:
  push:
    branches: [homepage-approved-mockups]
permissions:
  contents: write
jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[practical-import]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/import-practical-folders.py
      - name: Record real Practical folder contents
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vetverse-practicals.json
          git commit -m 'Record inspected subject Practical collections [generated]'
          git push origin HEAD:homepage-approved-mockups
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-source
          path: data/vetverse-practicals.json
