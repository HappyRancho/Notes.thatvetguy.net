name: Book cover source audit
on:
  push:
    branches: [homepage-approved-mockups]
permissions:
  contents: write
jobs:
  covers:
    if: contains(github.event.head_commit.message, '[cover-source-audit]') || contains(github.event.head_commit.message, '[cover-online]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests pymupdf
      - run: python3 scripts/audit-book-covers.py
        if: contains(github.event.head_commit.message, '[cover-source-audit]')
      - run: python3 scripts/collect-online-covers.py
        if: contains(github.event.head_commit.message, '[cover-online]')
      - name: Save source candidates for review
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/books/ data/book-cover-audit.json data/book-cover-audit-index.json
          if [ -f data/cover-online-candidates.json ]; then git add data/cover-online-candidates.json; fi
          git commit -m 'Record PDF and online cover candidates for visual review [generated]'
          git pull --rebase origin homepage-approved-mockups
          git push origin HEAD:homepage-approved-mockups
