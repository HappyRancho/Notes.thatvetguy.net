name: Inspect supplied public Drive folders
on: [push, workflow_dispatch]
jobs:
  inspect:
    if: (contains(github.event.head_commit.message, '[drive-inspect]') || contains(github.event.head_commit.message, '[drive-pagination]')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/crawl-public-drive.py
        if: ${{ !contains(github.event.head_commit.message, '[drive-pagination]') }}
      - run: node scripts/finish-drive-manifest.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-drive-inspection
          path: |
            docs/qa/task2-drive/
            data/drive_manifest.json
