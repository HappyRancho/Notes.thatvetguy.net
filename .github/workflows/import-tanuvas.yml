name: Refresh owner-organized TANUVAS Drive
on:
  push:
    branches: [homepage-approved-mockups]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  source:
    if: contains(github.event.head_commit.message, '[tanuvas-import]')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/import-tanuvas.py
      - name: Save verified source metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/tanuvas-source.json data/tanuvas-drive-inventory.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh owner-organized TANUVAS collections [generated]'
            git push origin HEAD:homepage-approved-mockups
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tanuvas-source-review
          path: data/tanuvas-source.json
